<form id="settings">
  <fieldset>
    <legend>Добавление спрайта для нарезки</legend>

    <p>
      <label>
        Исходное изображение
        <input name="sprite" type="file" accept="image/*, .json" multiple required>
      </label>
    </p>

    <p>
      <label>
        Количество спрайтов
        <input name="length" type="number" value="8" required>
      </label>

      <label>
        Ширина одного спрайта
        <input name="width" type="number" value="400" required>
      </label>

      <label>
        Высота одного спрайта
        <input name="height" type="number" value="260" required>
      </label>
    </p>

    <p>
      <button data-action="addToGrid">Добавить в сетку</button>
      <button data-action="reset">Сбросить редактор</button>
    </p>
  </fieldset>

  <fieldset>
    <legend>Рендер конечного спрайта</legend>

    <p>
      <button data-action="trimSizes">Подогнать размер спрайтов под размер изображений️</button>
    </p>

    <p>
      <label>
        Базовый коэффициент скорости
        <input name="speed" type="number" value="1" step="0.01" required>
      </label>

      <label>
        Базовый коэффициент масштабирования
        <input name="scale" type="number" value="1" min="0.01" step="0.01" required>
      </label>

      <label>
        Порядок кадров
        <select name="order">
          <option value="forward">По порядку</option>
          <option value="ping-pong">Вперёд и назад</option>
          <option value="random">Случайный</option>
        </select>
      </label>
    </p>

    <details>
      <summary>Дополнительные параметры анимации</summary>

      <p>
        <label>
          Прозрачность
          <input name="opacity" type="number" value="1" min="0" max="1" step="0.01" required>
        </label>

        <label>
          Повтор с кадра
          <input name="loopFrom" type="number" value="0" min="0" step="1" required>
        </label>

        <label>
          Случайная длительность кадра, мс: от
          <input name="durationMin" type="number" min="1" step="1" placeholder="не задана">
        </label>

        <label>
          до
          <input name="durationMax" type="number" min="1" step="1" placeholder="не задана">
        </label>
      </p>

      <p>
        <label>
          Вписать кадр в ширину
          <input name="maxWidth" type="number" min="1" step="1" placeholder="не задана">
        </label>

        <label>
          Вписать кадр в высоту
          <input name="maxHeight" type="number" min="1" step="1" placeholder="не задана">
        </label>

        <label>
          Смещение изображения X
          <input name="offsetX" type="number" step="any" placeholder="0">
        </label>

        <label>
          Смещение изображения Y
          <input name="offsetY" type="number" step="any" placeholder="0">
        </label>
      </p>

      <p>
        Область повтора по ширине, в пикселях кадра:
        <label>X <input name="repeatWidthX" type="number" min="0" step="1" placeholder="—"></label>
        <label>Y <input name="repeatWidthY" type="number" min="0" step="1" placeholder="—"></label>
        <label>Ширина <input name="repeatWidthWidth" type="number" min="1" step="1" placeholder="—"></label>
        <label>Высота <input name="repeatWidthHeight" type="number" min="1" step="1" placeholder="—"></label>
      </p>

      <p>
        Область повтора по высоте, в пикселях кадра:
        <label>X <input name="repeatHeightX" type="number" min="0" step="1" placeholder="—"></label>
        <label>Y <input name="repeatHeightY" type="number" min="0" step="1" placeholder="—"></label>
        <label>Ширина <input name="repeatHeightWidth" type="number" min="1" step="1" placeholder="—"></label>
        <label>Высота <input name="repeatHeightHeight" type="number" min="1" step="1" placeholder="—"></label>
      </p>
    </details>

    <p>
      <label>
        Имя файла
        <input name="name" value="merged" required>
      </label>

      <label>
        Расширение
        <select name="ext" required>
          <option value="webp" selected>webp</option>
          <option value="png">png</option>
          <option value="jpeg">jpeg</option>
        </select>
      </label>

      <button data-action="renderGrid">Рендерить спрайты</button>
    </p>
  </fieldset>
</form>

<div class="editor">
  <div id="grid" class="grid"></div>
  <animation-preview class="preview"></animation-preview>
</div>
